name: whyisitnotpossible

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # One-shot: applies pending Prisma migrations, then exits. api/worker both
  # wait on this completing successfully rather than each racing to migrate
  # on their own startup. DATABASE_URL comes straight from .env (see
  # DATABASE_URL comment there) — this deployment uses an existing external
  # database, not a self-managed Postgres container.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: .env
    command: ["npx", "prisma", "migrate", "deploy"]
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 5000
      NODE_ENV: production
    command: ["node", "--enable-source-maps", "dist/index.mjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [internal]

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    command: ["node", "--enable-source-maps", "dist/worker.mjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: ../../whyisitnotpossible-ui
      dockerfile: Dockerfile
      args:
        PORT: "5173"
        BASE_PATH: "/"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Same paths certbot writes to below — nginx.conf's `ssl_certificate`
      # directives read the live cert straight out of here. Read-only since
      # this container only ever consumes certs, never issues them.
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  # Renews the cert twice a day (certbot no-ops unless it's within its
  # ~30-day renewal window, so this is safe to leave running indefinitely).
  # Does NOT obtain the first certificate — that's the deploy/init-certbot.sh
  # bootstrap, run once by hand before the first `./deploy.sh`. See
  # deploy/README.md.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >-
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done'

networks:
  internal:

volumes:
  redisdata:
